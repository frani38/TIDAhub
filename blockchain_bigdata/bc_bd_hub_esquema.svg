<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="168" viewBox="0 0 1100 168" role="img" aria-labelledby="title desc">
  <title id="title">Relación entre Blockchain y Big Data</title>
  <desc id="desc">Blockchain registra y verifica; Big Data genera, almacena y analiza; el solape son convergencias posibles.</desc>
  <rect width="1100" height="168" fill="#f8fafc"/>
  <defs>
    <style type="text/css"><![CDATA[
      .t{font-family:Segoe UI,system-ui,sans-serif;fill:#0f172a}
      .h{font-size:15px;font-weight:700}
      .s{font-size:12px;font-weight:600}
      .xs{font-size:11px}
      .muted{fill:#475569}
    ]]></style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <text class="t h" x="550" y="22" text-anchor="middle">Dos tecnologías distintas que pueden converger</text>

  <rect x="36" y="40" width="300" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="t h" x="186" y="72" text-anchor="middle" fill="#1d4ed8">BLOCKCHAIN</text>
  <text class="t xs" x="186" y="96" text-anchor="middle">Registrar y verificar</text>
  <text class="t xs muted" x="186" y="116" text-anchor="middle">integridad · consenso · auditabilidad</text>

  <rect x="400" y="48" width="300" height="84" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="t s" x="550" y="78" text-anchor="middle">Solape posible</text>
  <text class="t xs muted" x="550" y="100" text-anchor="middle">anclar huellas · trazabilidad · analítica sobre ledgers</text>

  <rect x="764" y="40" width="300" height="100" rx="12" fill="#dcfce7" stroke="#059669" stroke-width="2"/>
  <text class="t h" x="914" y="72" text-anchor="middle" fill="#047857">BIG DATA</text>
  <text class="t xs" x="914" y="96" text-anchor="middle">Generar, almacenar y analizar</text>
  <text class="t xs muted" x="914" y="116" text-anchor="middle">volumen · velocidad · variedad · valor</text>

  <line x1="336" y1="90" x2="400" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="90" x2="764" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

  <text class="t xs muted" x="550" y="158" text-anchor="middle">No son intercambiables: cada una resuelve un problema distinto</text>
</svg>
