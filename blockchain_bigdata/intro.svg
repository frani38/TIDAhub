<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="introTitle introDesc">
  <title id="introTitle">Datos confiables, descentralizados y con valor</title>
  <desc id="introDesc">Infograf&#237;a de sinergia entre Blockchain y Big Data: aplicaciones, atributos, posibilidades futuras y cadena de valor del dato.</desc>
