    <text x="74" y="184" fill="#0f172a" font-size="14" font-weight="700">FINANZAS</text>
    <text x="74" y="202" fill="#475569" font-size="11">Fraude &#183; Auditor&#237;a &#183; KYC/AML &#183; Reportes</text>

